  # ---------- 邮件（M5 邮箱验证码登录，dev 直连 163 SMTP） ----------
  # 键用 Spring Boot 标准 spring.mail.*：host 有值时 Boot 才装配 JavaMailSender，
  # username/password 留空则发码端点返回 8374「邮件服务未配置」，不影响起服与其他功能。
  # 163 需开「SMTP 服务」并拿到客户端授权码（不是登录密码）；465 = SSL 隐式加密，必须 mail.smtp.ssl.enable=true。
  # ⚠️ 两行凭据由龙哥自己填（AI 不往配置文件里写口令）：username = 发件邮箱全称，password = 客户端授权码。
  mail:
    host: smtp.163.com
    port: 465
    username: Alex_Server@163.com
    password: THXBuYqhngnRn8kn
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # 三个超时都设 8s：SMTP 卡住时不能把发码请求一起拖死（同步发信，见 EmailCodeSender 注释）
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

