    # BabyLog 不启用多租户（M4 拍板：bl_ 表无 tenant_id，开了绑租户账号摸 bl_ 表会 Unknown column）
    enabled: false       # 脚手架租户能力的 IT 测试用各自 test yml，不受此影响
    mode: column         # column / schema / datasource
