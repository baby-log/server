# ============================================================
# 生产配置（本仓库为私有仓库，凭据直接填在本文件，不再走环境变量注入）。
# 部署前必填：MySQL url/username/password、Redis host/password、
#           field-encrypt-key（写入即不可换）、LLM api-key（AI 能力）。
# ============================================================
spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://10.0.4.15:3306/babylog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&allowMultiQueries=false
          username: babylog
          password: 2jn6xR27Sw8M6kNW
          driver-class-name: com.mysql.cj.jdbc.Driver
      # ===== 连接池（V3.1-G · P1-B2）=====
      # 与容量无关的生产参数（获取等待/有效性检测/驱逐/保活/泄漏回收/慢SQL）
      # 统一放在 application.yml 的 spring.datasource.dynamic.druid；
      # 这里只覆盖**容量三件套**，prod 按线上并发上调。
      #
      # ⚠️ 容量口径：max-active × 应用实例数 + 运维/定时任务余量 必须 < MySQL max_connections
      #    （MySQL 默认 151）。若将来扩到多实例，这里要同步下调，否则表现为
      #    「Too many connections」而不是连接池报错，极难归因。
      # ⚠️ 再次提醒：本项目是 **Druid**，不是 HikariCP，别写 hikari.*。
      druid:
        initial-size: 5
        min-idle: 10
        max-active: 50
  data:
    redis:
      host: 10.0.4.15
      port: 6379
      password: ZpHSQ9qe22Y1UoHV
      timeout: 5s
      database: 0

  ai:
    # 生产禁止凭据兜底，未注入时 AI 能力不可用
    openai:
      api-key: sk-ws-H.RXELPDM.Nvf2.MEYCIQDqSA0lvw96Ec1Do29Rak5agBBL6DXno6nbapmKIBgHugIhAIij2gYu8pdVRSWwL9sy5v9spPPAswu_7fxq0XxOqRpC
    # 向量库（2026-10-02）：Milvus 服务端**暂不部署**，统一走 simple（内存 + JSON 快照，零中间件）。
    # ① spring.ai.vectorstore.type 必须显式设为 simple——Milvus 自动装配 matchIfMissing=true，
    #    不设会按默认 localhost:19530 连 Milvus 导致**启动失败**（dev 2026-09-24 实测同因）；
    # ② 知识库向量类型走 babylog.kb.vector-store.type（application.yml 默认 simple，库表默认也是 simple）；
    # ③ 简单向量库为**进程内内存**实现：单机够用，多实例部署时各实例快照不共享，需保持单实例。
    # 将来部署 Milvus 服务端后：把 type 改回 milvus 并恢复下方 milvus 段即可，业务代码零改动。
    vectorstore:
      type: simple
