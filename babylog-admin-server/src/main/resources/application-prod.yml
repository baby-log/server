  # ---------- 邮件（M5 邮箱验证码登录，dev 直连 163 SMTP） ----------
  # 键用 Spring Boot 标准 spring.mail.*：host 有值时 Boot 才装配 JavaMailSender，
  # username/password 留空则发码端点返回 8374「邮件服务未配置」，不影响起服与其他功能。
  # 163 需开「SMTP 服务」并拿到客户端授权码（不是登录密码）；465 = SSL 隐式加密，必须 mail.smtp.ssl.enable=true。
  # ⚠️ 两行凭据由龙哥自己填（AI 不往配置文件里写口令）：username = 发件邮箱全称，password = 客户端授权码。
  mail:
    host: smtp.163.com
    port: 465
    username: Alex_Server@163.com
    password: THXBuYqhngnRn8kn
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # 三个超时都设 8s：SMTP 卡住时不能把发码请求一起拖死（同步发信，见 EmailCodeSender 注释）
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  # 生产口径（2026-11-13 部署批）：全量 info。
  # 不要回到 debug：mybatis-plus 的 log-impl 是 Slf4jImpl，com.babylog 一开 debug
  # 就会按 mapper logger 把 SQL 与**实际参数**打出来（邮箱/昵称/喂养记录全落盘），
  # 且日志量按天翻几倍，100MB 滚动也扛不住。
  # 临时排障用环境变量覆盖，别改这里：LOGGING_LEVEL_COM_BABYLOG=debug
  level:
    com.babylog: info
    org.dromara.warm.flow: info

# Knife4j 生产过滤器统一封禁 API 文档面；SpringDoc 必须保持装配，否则 Knife4j 控制器缺 Bean 导致启动失败
springdoc:
  api-docs:
    enabled: true

knife4j:
  # enable 必须为 true 才会注册 production 安全过滤器；设 false 反而会让静态 UI 继续暴露
  enable: true
  production: true


