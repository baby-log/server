    admin-addresses: http://175.24.176.176:8100
    app-name: babylog-dev-executor
    port: 9999
    group-id: 3   # admin UI「执行器管理」里 babylog-dev-executor 的 ID，核查后修正
    access-token: qazwsx123   # 与 admin 的 xxl.job.accessToken 一致，核查后修正
  # ST-DATAINSPECT（S130）：通用数据监控。安全默认——只查白名单表（allow-all-tables=false），
  # 需要放开某张表就在这里加（表白名单是硬生效的安全过滤，与 monitor:data:* 权限无关）
  datainspect:
    mysql:
      table-whitelist:
        - sys_user
        - sys_config
        - sys_notice
        - sys_oper_log
        - sys_login_log
        - sys_job
        - sys_job_log
  # 检索：BabyLog 业务检索在 App 端 Room 完成，服务端全文检索仅 AI KB 需要——
  # 现阶段用 simple 内存实现（零中间件，进程内可检索、重启即失）。
  # AI KB 阶段要上 ES 时改回 type: es-java 并恢复 es-java 子段
  # （uris/username/password/compatibility-mode，接法见 pivotos-doc 检索章节）。
  search:
    type: simple
