    access-key: AKIDKhrqb9UbVCg3D9B9AA4qPuENXUJvJUSC
    secret-key: ayBIG1aw51jEVlqiNtDKOL7i5HJ8k9LO
    bucket: huweilong-1440252518
    region: ap-shanghai
    public-url: https://cos.293242.com
  # 调度：XXL-Job 调度中心已接入（175.24.176.176:8101，2026-11-12 实测可达，根路径无 context-path）。
  # ⚠️ 配了此段后 LocalRetentionScheduler 本地兜底退出——**必须在 admin UI 建好执行器与 7 个任务**，
